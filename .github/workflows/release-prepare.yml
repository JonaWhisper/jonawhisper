name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Dry run (no push, no PR)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          output=$(bash .github/scripts/bump-version.sh ${{ inputs.bump }})
          echo "$output"
          version=$(echo "$output" | grep '^version=' | cut -d= -f2)
          tag=$(echo "$output" | grep '^tag=' | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate changelog (this release)
        uses: orhun/git-cliff-action@v4
        id: cliff-release
        with:
          config: cliff.toml
          args: --unreleased --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog (full history)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "### Dry Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ steps.bump.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Changed files:" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Release notes:" >> "$GITHUB_STEP_SUMMARY"
          cat CHANGES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release branch and PR
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          BRANCH="release/${TAG}"

          git checkout -b "$BRANCH"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml CHANGELOG.md
          git commit -m "release: ${TAG}"
          git push origin "$BRANCH"

          gh pr create \
            --title "release: ${TAG}" \
            --body "$(cat <<EOF
          ## Release ${TAG}

          Version bump: ${{ inputs.bump }} → ${VERSION}

          ### Changelog
          $(cat CHANGES.md)

          ---
          Merging this PR will automatically create the tag and trigger the build + release workflow.
          EOF
          )" \
            --base main \
            --head "$BRANCH"
