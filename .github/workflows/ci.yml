name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (Node) ──────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc -b --noEmit

      - name: Tests
        run: npx vitest run

  # ── Dependency resolution (peer conflicts) ────────────
  peers:
    name: Peer resolution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # npm ci follows the lockfile and never resolves peer ranges, so a
      # conflict stays invisible until someone runs npm install — which
      # build.sh does. Resolving without the lockfile is what surfaces it.
      - name: Resolve without the lockfile
        run: |
          rm -f package-lock.json
          npm install --dry-run

  # ── Rust cross-compile check (Windows) ────────────────
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-x64
          cache-on-failure: true

      # -p jona-whisper, not --workspace: engine crates that cannot build off
      # macOS (voxtral, qwen) stay workspace members but are gated out of the
      # binary's dependencies, and --workspace would compile them anyway.
      - name: Check
        working-directory: src-tauri
        run: cargo check -p jona-whisper

      # The macOS job cannot reach these: everything under cfg(windows) is
      # invisible to it, tests included.
      - name: Tests
        working-directory: src-tauri
        run: cargo test -p jona-platform

  # ── Rust (clippy + tests) ──────────────────────────────
  rust:
    name: Rust
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/src-tauri/cmake/arm-ggml-fix.cmake
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-arm64
          cache-on-failure: true

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace
