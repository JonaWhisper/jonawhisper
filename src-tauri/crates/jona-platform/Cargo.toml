[package]
name = "jona-platform"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
serde.workspace = true
serde_json.workspace = true
crossbeam-channel = "0.5.15"
log.workspace = true
tauri = { version = "2" }
tauri-plugin-clipboard-manager = "2"

# Off macOS the audio device list comes from cpal instead of CoreAudio.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cpal = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
# The COM interfaces ducking needs (IMMDeviceEnumerator, IAudioEndpointVolume)
# are not in windows-sys, which carries only the C-style API.
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
# Direct, not just through windows::core: the #[implement] macro expands to
# ::windows_core paths, which only resolve if the crate is a dependency by that
# name. Reaching the macro through the windows re-export is not enough.
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSApplication", "NSRunningApplication"] }
block2 = "0.6"
smappservice-rs = "0.1"
