[package]
name = "jona-engine-bert"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
inventory.workspace = true
jona-types = { path = "../jona-types" }
jona-engines = { path = "../jona-engines" }
ort.workspace = true
tokenizers.workspace = true
serde_json.workspace = true
log.workspace = true

# metal/accelerate pull objc2, which refuses to build off Apple platforms.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11", features = ["metal", "accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
